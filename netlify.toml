[build]
command = "pnpm run build:client"
functions = "netlify/functions"
publish = "dist/spa"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["exceljs", "chartsheet", "web-push", "serverless-http"]
  included_files = [
    "node_modules/exceljs/**",
    "node_modules/chartsheet/**",
    "node_modules/web-push/**",
    "node_modules/serverless-http/**"
  ]

[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
